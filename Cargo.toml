[package]
name = "grafana-apprise-adapter"
version = "0.1.0"
authors = ["Jake Howard <git@theorangeone.net>"]
edition = "2018"
repository = "https://github.com/RealOrangeOne/grafana-apprise-adapter"
readme = "README.md"
license-file = "LICENSE"

[dependencies]
actix-web = "4"
